
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenman</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0d0b;
            color: #e8e8e8;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        main {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .icon {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.8px;
            margin: 0 0 8px;
        }

        .description {
            color: #858b85;
            font-size: 14px;
            margin: 0 0 42px;
        }

        .release-label {
            color: #858b85;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .version {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .release-date {
            color: #686f68;
            font-size: 12px;
            margin-bottom: 22px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .download {
            display: inline-block;
            padding: 12px 30px;
            background: #35b85a;
            color: #071009;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 5px;
            transition: background 0.15s;
        }

        .download:hover {
            background: #43cc69;
        }

        .download.disabled {
            background: #354238;
            color: #9ba69e;
            pointer-events: none;
        }

        
.all-releases {
    display: inline-block;
    color: #b5c0b5;
    font-size: 13px;
    text-decoration: none;
    padding: 10px 22px;
    border: 1px solid #354238;
    border-radius: 5px;
    background: #141814;
    transition: all 0.15s;
}

.all-releases:hover {
    color: #43cc69;
    border-color: #35b85a;
    background: #192019;
}

    </style>
</head>

<body>
    <main>
        <img id="icon" class="icon" alt="Greenman">

        <h1>Greenman</h1>
        <p class="description">CLI-based Organization Tool</p>

        <div class="release-label">Latest version</div>
        <div id="version" class="version">Loading...</div>
        <div id="release-date" class="release-date"></div>

        <div class="buttons">
            <a id="download" class="download disabled" href="#">
                Download ZIP
            </a>

            <a
                class="all-releases"
                href="https://github.com/BoKrsteski/greenman/releases"
                target="_blank"
                rel="noopener noreferrer"
            >
                View all versions
            </a>
        </div>
    </main>

    <script>
        const API = "https://api.github.com/repos/BoKrsteski/greenman";

        async function loadRelease() {
            const version = document.getElementById("version");
            const download = document.getElementById("download");
            const icon = document.getElementById("icon");
            const releaseDate = document.getElementById("release-date");

            try {
                const [repoResponse, releaseResponse] = await Promise.all([
                    fetch(API),
                    fetch(API + "/releases/latest")
                ]);

                if (!repoResponse.ok || !releaseResponse.ok) {
                    throw new Error("Could not load release");
                }

                const repo = await repoResponse.json();
                const release = await releaseResponse.json();

                icon.src = `https://raw.githubusercontent.com/BoKrsteski/greenman/${encodeURIComponent(repo.default_branch)}/greenman_GUI/data/icons/greenman.png`;

                const zip = release.assets.find(asset =>
                    asset.name.toLowerCase().endsWith(".zip")
                );

                if (!zip) {
                    throw new Error("No ZIP file found");
                }

                version.textContent = release.tag_name;

                const date = new Date(release.published_at);
                releaseDate.textContent = "Released " +
                    date.toLocaleDateString("en-GB", {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    });

                download.href = zip.browser_download_url;
                download.classList.remove("disabled");

            } catch (error) {
                version.textContent = "Unavailable";
                releaseDate.textContent = "Could not load the latest release.";
                download.textContent = "Download unavailable";
            }
        }

        loadRelease();
    </script>
</body>
</html>
