name: auto-releaseCLI

on:
  push:
    branches:
      - main

jobs:
  detect-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_DIR: 'greenman_for_CLI'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in target directory
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: main
          filters: |
            src:
              - '${{ env.TARGET_DIR }}/**'

      - name: Clean and package
        if: steps.filter.outputs.src == 'true'
        run: |
          find ${{ env.TARGET_DIR }} -type f -name '*.pyc' -delete
          find ${{ env.TARGET_DIR }} -type d -name '__pycache__' -exec rm -rf {} +
          zip -r greenman_cli.zip ${{ env.TARGET_DIR }}/

      - name: Get next version
        if: steps.filter.outputs.src == 'true'
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")
          
          count=$(echo "$response" | jq 'if type == "array" then [.[] | select(.tag_name | startswith("CLI-VERSION-"))] | length else 0 end')
          
          echo "num=$((count + 1))" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: steps.filter.outputs.src == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: CLI-VERSION-${{ steps.version.outputs.num }}
          name: "Greenman CLI version: ${{ steps.version.outputs.num }}"
          files: greenman_cli.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
