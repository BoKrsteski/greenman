name: Auto-Release CLI

on:
  push:
    branches:
      - main

jobs:
  detect-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_DIR: 'greenman_for_CLI'

      steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in target directory
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: main
          filters: |
            src:
              - '${{ env.TARGET_DIR }}/**'

      - name: Get next version
        if: steps.filter.outputs.src == 'true'
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # ... (your existing version logic, unchanged)

      - name: Update version in source
        if: steps.filter.outputs.src == 'true'
        run: |
          sed -i "s/^VERSION = .*/VERSION = \"${{ steps.version.outputs.version }}\"/" \
            ${{ env.TARGET_DIR }}/CLIgreenman.py

      - name: Clean and package
        if: steps.filter.outputs.src == 'true'
        run: |
          find ${{ env.TARGET_DIR }} -type f -name '*.pyc' -delete
          find ${{ env.TARGET_DIR }} -type d -name '__pycache__' -exec rm -rf {} +
          zip -r greenman_cli.zip ${{ env.TARGET_DIR }}/

      - name: Create Release
        if: steps.filter.outputs.src == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Greenman CLI ${{ steps.version.outputs.version }}"
          files: greenman_cli.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   