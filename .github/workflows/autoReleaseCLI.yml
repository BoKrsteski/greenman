name: Auto-Release CLI

on:
  push:
    branches:
      - main

jobs:
  detect-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_DIR: 'greenman_for_CLI'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in target directory
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: main
          filters: |
            src:
              - '${{ env.TARGET_DIR }}/**'

      - name: Get next version
        if: steps.filter.outputs.src == 'true'
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")

          latest_tag=$(echo "$response" | jq -r \
            '[.[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.published_at) | last | .tag_name // ""')

          if [[ -n "$latest_tag" ]]; then
            version_str="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version_str"
          else
            major=0; minor=0; patch=0
          fi

          if [[ "$COMMIT_MESSAGE" =~ ^M\  ]]; then
            major=$((major + 1))
          elif [[ "$COMMIT_MESSAGE" =~ ^m\  ]]; then
            minor=$((minor + 1))   
          else
            patch=$((patch + 1))
          fi

          new_version=$(printf "v%02d.%02d.%02d" $major $minor $patch)
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "Latest: $latest_tag → Next: $new_version (commit: ${COMMIT_MESSAGE:0:60})"

      - name: Update version in source
        if: steps.filter.outputs.src == 'true'
        run: |
          sed -i "s/^VERSION = .*/VERSION = \"${{ steps.version.outputs.version }}\"/" \
            ${{ env.TARGET_DIR }}/CLIgreenman.py

      - name: Clean and package
        if: steps.filter.outputs.src == 'true'
        run: |
          find ${{ env.TARGET_DIR }} -type f -name '*.pyc' -delete
          find ${{ env.TARGET_DIR }} -type d -name '__pycache__' -exec rm -rf {} +
          zip -r greenman_cli.zip ${{ env.TARGET_DIR }}/

      - name: Create Release
        if: steps.filter.outputs.src == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Greenman CLI ${{ steps.version.outputs.version }}"
          files: greenman_cli.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
